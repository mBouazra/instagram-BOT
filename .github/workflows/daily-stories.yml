Bonne nouvelle d’abord : rien n’a été publié, donc pas de doublon ni de story cassée. Mais Instagram a refusé de traiter toutes les vidéos, et l’ancien script n’affichait pas pourquoi.

Mon hypothèse la plus probable : Instagram refuse de télécharger des vidéos depuis ses propres liens de stockage (les liens scontent…cdninstagram.com). Il faut confirmer avec le vrai message d’erreur avant de corriger.

1. Mets le bot en pause pour qu’il ne retente pas toutes les heures : dans config.json, mets "paused": true → Commit changes.

2. Remplace les deux fichiers sur GitHub par les nouvelles versions :

post_stories.py (à la racine) : ✏️ → Ctrl+A → colle le contenu du nouveau post_stories.py → Commit
.github/workflows/daily-stories.yml : même chose avec daily-stories.yml
Ou plus simple : Add file → Upload files, glisse post_stories.py dessus pour l’écraser, et fais pareil pour l’autre dans le dossier .github/workflows.

3. Lance le diagnostic

Actions → Stories quotidiennes → Run workflow → coche uniquement “Diagnostic sur 1 vidéo” → Run.

Il teste une seule vidéo sans rien publier et affiche la réponse complète d’Instagram. Envoie-moi le journal, comme tout à l’heure, et je saurai exactement quoi corriger.


