name: Stories quotidiennes

on:
  schedule:
    # Plusieurs essais par après-midi (heures UTC) : GitHub saute souvent des créneaux.
    # Le script vérifie l'heure de Paris et ne publie qu'une fois par jour.
    - cron: "17,47 12-20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publier maintenant (même si déjà fait aujourd'hui)"
        type: boolean
        default: false
      dry_run:
        description: "Test à blanc (ne publie rien)"
        type: boolean
        default: false
      diag:
        description: "Diagnostic sur 1 vidéo (ne publie rien)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier s'il faut publier
        id: check
        if: ${{ !inputs.dry_run && !inputs.diag }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          CHECK: "1"
        run: python -u post_stories.py

      - name: Récupérer les vidéos déjà converties
        if: ${{ steps.check.outputs.run == 'true' || inputs.dry_run || inputs.diag }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Installer ffmpeg
        if: ${{ steps.check.outputs.run == 'true' || inputs.dry_run || inputs.diag }}
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Publier les stories
        if: ${{ steps.check.outputs.run == 'true' || inputs.dry_run || inputs.diag }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          DIAG: ${{ inputs.diag && '1' || '0' }}
        run: python -u post_stories.py

      - name: Mémoriser la date de publication
        if: always()
        run: |
          if [ -n "$(git status --porcelain last_posted.txt)" ]; then
            git config user.name "story-bot"
            git config user.email "story-bot@users.noreply.github.com"
            git add last_posted.txt
            git commit -m "Stories du $(cut -c1-10 last_posted.txt)"
            git pull --rebase
            git push
          fi
